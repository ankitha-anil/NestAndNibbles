<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nest & Nibbles</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nest & Nibbles">
<meta name="theme-color" content="#f5f5f5">
<link id="touchicon" rel="apple-touch-icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a solid plum rail, a dashboard home with a greeting banner and four colour tiles, then one quiet white-card page per room. */
:root{
  --plum:#8c6293; --paper:#f5f5f5; --leaf:#658150; --clay:#d3782b; --bark:#723508;
  --ink:#2f211a; --muted:#85776f; --card:#ffffff; --line:#e9e4e1;
  --plum-t:#f1e9f3; --leaf-t:#e8efe3; --clay-t:#fbeada;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Playfair Display",Georgia,serif;
  --shadow:0 1px 2px rgba(47,33,26,.04),0 8px 24px rgba(47,33,26,.05);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:500 15.5px/1.5 var(--ui);display:flex;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1{font:800 26px/1.15 var(--ui);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:700 16px/1.25 var(--ui);letter-spacing:-.01em;margin:0 0 12px}
p{margin:0}
.muted{color:var(--muted);font-size:13.5px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--clay);outline-offset:2px}

/* rail */
nav{flex:none;width:94px;margin:14px 0 14px 14px;padding:16px 10px;border-radius:28px;background:var(--plum);display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{font:600 15px/1.1 var(--serif);color:#fff;text-align:center;padding:6px 0 14px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:16px;color:rgba(255,255,255,.82);font-size:11px;font-weight:700}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:var(--paper);color:var(--plum)}
.tab:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.tab b{position:absolute;top:3px;right:12px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--clay);color:#fff;font-size:11px;line-height:19px;text-align:center;font-variant-numeric:tabular-nums}
.sync{margin-top:auto;padding-top:12px;text-align:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.75)}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);margin-right:5px}
.sync.on i{background:#c9e2b6}

main{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:26px clamp(16px,3.2vw,40px) 44px}
.wrap{max-width:1040px;margin:0 auto}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head .end{margin-left:auto}

/* pieces */
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;align-items:start}
.grid .card{margin:0}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.btn{min-height:44px;padding:0 17px;border-radius:12px;background:var(--plum);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.soft{background:var(--plum-t);color:var(--plum)}
.btn.leaf{background:var(--leaf)}
.btn.clay{background:var(--clay-t);color:var(--bark)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.sm{min-height:36px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ico{width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;color:#b3a8a1;font-size:16px;flex:none}
.ico:hover,.ico:active{background:var(--paper);color:var(--bark)}
input,select,textarea{min-height:44px;padding:9px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;width:100%}
input::placeholder,textarea::placeholder{color:#a79c95}
textarea{resize:vertical;line-height:1.45}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.addbar{display:flex;gap:8px;margin-bottom:14px}
.addbar input{flex:1;min-width:0}
.addbar .w{flex:0 0 124px}
.seg{display:inline-flex;background:#fff;border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap;box-shadow:var(--shadow)}
.seg button{min-height:36px;padding:0 14px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--plum);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--paper);color:var(--muted)}
.chip.have{background:var(--leaf-t);color:#42592f}
.chip.miss{background:var(--clay-t);color:var(--bark)}
.chip.listed{background:var(--plum-t);color:var(--plum)}
.chip button{font-size:13px;color:inherit;opacity:.7;padding:0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}

/* home */
.banner{background:var(--clay-t);border-radius:24px;padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.banner h1{font:600 32px/1.15 var(--serif);letter-spacing:0;color:var(--bark)}
.banner p{color:var(--bark);margin-top:8px;max-width:46ch}
.banner svg{flex:none;width:150px;height:112px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.tile{border-radius:20px;padding:16px 18px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;min-height:104px}
.tile span{font-weight:700;font-size:14px}
.tile b{font:800 34px/1 var(--ui);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.t1{background:var(--plum)}.t2{background:var(--leaf)}.t3{background:var(--clay)}.t4{background:var(--bark)}

/* grocery board */
.mic{flex:none;width:46px;height:44px;border-radius:12px;background:var(--clay-t);color:var(--bark);display:grid;place-items:center}
.mic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic.on{background:var(--clay);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(211,120,43,.18)}}
.board{background:#fff;border-radius:20px;padding:10px 22px;min-height:220px;box-shadow:var(--shadow);margin-bottom:14px}
.board ul,ul.glist{list-style:none;margin:0;padding:0}
.board ul{columns:2;column-gap:36px}
@media (max-width:620px){.board ul{columns:1}}
.glist li,.board li{break-inside:avoid;display:flex;align-items:center;gap:11px;min-height:50px;font-weight:600;border-bottom:1px solid var(--line);margin:0}
.glist li:last-child{border-bottom:0}
.glist li span,.board li span{flex:1;min-width:0;overflow-wrap:anywhere;padding:8px 0}
.tick{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid #cdbfd0;display:grid;place-items:center;color:#fff;font-size:14px;background:#fff}
li.done .tick{background:var(--leaf);border-color:var(--leaf)}
li.done span{text-decoration:line-through;color:#b3a8a1;font-weight:500}

/* lists */
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-height:54px}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.item .t small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.due{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--leaf-t);color:#42592f;white-space:nowrap}
.due.soon{background:var(--clay-t);color:var(--bark)}
.due.over{background:var(--bark);color:#fff}
.bar{height:6px;border-radius:3px;background:var(--paper);overflow:hidden;margin:8px 0 12px}
.bar div{height:100%;background:var(--leaf);border-radius:3px}
.rc h2{display:flex;align-items:center;gap:8px;margin-bottom:0}
.rc h2 span{flex:1}
.rc.pick{outline:2px solid var(--clay)}

/* spinner */
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 20px 22px;text-align:center}
.bigmic{width:116px;height:116px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;margin-bottom:10px;box-shadow:0 0 0 10px var(--plum-t),0 12px 28px rgba(140,98,147,.35)}
.bigmic svg{width:48px;height:48px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bigmic:active{transform:scale(.96)}
.bigmic.on{background:var(--clay);box-shadow:0 0 0 10px var(--clay-t);animation:ring 1.1s infinite}
@keyframes ring{50%{box-shadow:0 0 0 24px rgba(211,120,43,.16)}}
.hero b{font-size:18px}
#heard{min-height:24px;color:var(--plum);font-weight:700}
.hero .addbar{margin:10px 0 0;width:100%;max-width:520px}
.spin{max-width:560px;margin:0 auto}
.wheelbox.go:before{animation:tick .12s linear infinite alternate;transform-origin:50% 0}
@keyframes tick{from{transform:rotate(-16deg)}to{transform:rotate(10deg)}}
.hub{animation:breathe 2.4s ease-in-out infinite}
.wheelbox.go .hub{animation:none;transform:scale(.9)}
@keyframes breathe{50%{transform:scale(1.08)}}
.wheelbox.win canvas{animation:glow .9s ease-in-out 2}
@keyframes glow{50%{box-shadow:0 0 0 6px #fff,0 0 0 16px var(--clay-t),0 10px 28px rgba(47,33,26,.12)}}
.result.rolling{color:#b3a8a1}
.result.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:15}
.keybox{font:700 15px/1.5 ui-monospace,Menlo,monospace;background:var(--paper);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.spin .seg{flex-wrap:nowrap;box-shadow:none;background:var(--paper);max-width:100%}
.spin .seg button{padding:0 11px;font-size:13px;white-space:nowrap}
.wheelbox{position:relative;width:min(340px,100%);aspect-ratio:1;margin:28px auto 16px;display:grid;place-items:center}
.wheelbox canvas{grid-area:1/1;display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 6px #fff,0 10px 28px rgba(47,33,26,.12);transition:transform 5s cubic-bezier(.1,.7,.08,1)}
.wheelbox:before{content:"";position:absolute;z-index:3;left:50%;top:-16px;width:0;height:0;margin-left:-13px;border:13px solid transparent;border-top:24px solid var(--ink)}
.hub{grid-area:1/1;position:relative;z-index:2;width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(47,33,26,.18);font-weight:800;font-size:15px;letter-spacing:.06em;color:var(--plum);display:grid;place-items:center;line-height:1}
.login{max-width:400px;margin:8vh auto 0}
.login .brandmark{font:600 34px/1.15 var(--serif);color:var(--bark);margin-bottom:6px}
.result{text-align:center;font:800 24px/1.2 var(--ui);letter-spacing:-.02em;min-height:34px;margin:6px 0 12px;color:var(--plum)}

/* notes */
#pad{width:100%;height:320px;border-radius:14px;border:1.5px solid var(--line);background:#fff;touch-action:none;display:block}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.recbtn{width:64px;height:64px;border-radius:50%;background:var(--clay);color:#fff;flex:none;display:grid;place-items:center}
.recbtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.recbtn.on{animation:pulse 1s infinite;background:var(--bark)}
audio{width:100%;margin-top:12px}

/* overlay */
#modal{position:fixed;inset:0;background:rgba(47,33,26,.35);display:none;place-items:center;padding:16px;z-index:10}
#modal.on{display:grid}
#modal form{background:#fff;border-radius:22px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
details{margin-top:10px}
summary{font-weight:700;min-height:40px;display:flex;align-items:center;cursor:pointer;color:var(--plum)}
ol{padding-left:20px;margin:6px 0;color:var(--muted);font-size:14px}
ol li{margin-bottom:5px}
code{background:var(--paper);padding:1px 6px;border-radius:6px;font-size:12.5px;overflow-wrap:anywhere;color:var(--ink)}
.check{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px;font-weight:600;min-height:44px;margin:4px 0}
.check input{width:22px;min-height:22px;height:22px;accent-color:var(--plum);flex:none}

@media (max-width:820px){
  body{flex-direction:column-reverse}
  nav{width:auto;margin:0;border-radius:22px 22px 0 0;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:0;overflow-x:auto}
  .brand,.sync{display:none}
  .tab{flex:1;min-width:44px;padding:7px 1px;font-size:10px}
  .tab b{right:2px;top:0}
  main{padding-top:18px}
  h1{font-size:22px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .banner{padding:20px}.banner h1{font-size:26px}.banner svg{display:none}
  .addbar{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.wheelbox canvas{transition-duration:.3s}}
</style>
</head>
<body>
<nav id="nav" aria-label="Rooms"></nav>
<main><div class="wrap" id="view"></div></main>
<div id="modal"></div>
<div id="toast" role="status"></div>

<script>
(function(){
/* ---------- helpers & state ---------- */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const dayDiff=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const KEY='nestnibbles.v1',LKEY='nestnibbles.device';
/* Project identifiers for the household database. These two values are safe to publish:
   they only say where the database is. Reading or writing it needs the household sign-in. */
const CONFIG={databaseURL:'https://nestandnibbles-dafc2-default-rtdb.firebaseio.com',apiKey:'AIzaSyDRGncoTzfsFMpqn6iwON4w4FiNERuaecQ'};
const GATED=!!(CONFIG.databaseURL&&CONFIG.apiKey);
const ago=n=>addDays(today(),-n);
const DEFAULTS=()=>({
  groceries:[],
  inv:[
    {id:uid(),t:'Eggs',qty:'6',loc:'fridge',exp:''},{id:uid(),t:'Milk',qty:'1 L',loc:'fridge',exp:addDays(today(),3)},
    {id:uid(),t:'Butter',qty:'',loc:'fridge',exp:''},{id:uid(),t:'Rice',qty:'1 kg',loc:'pantry',exp:''},
    {id:uid(),t:'Pasta',qty:'2 packs',loc:'pantry',exp:''},{id:uid(),t:'Onions',qty:'4',loc:'pantry',exp:''},
    {id:uid(),t:'Garlic',qty:'',loc:'pantry',exp:''},{id:uid(),t:'Olive oil',qty:'',loc:'pantry',exp:''},
    {id:uid(),t:'Frozen peas',qty:'',loc:'freezer',exp:''}],
  routines:[
    {id:uid(),t:'Laundry',every:4,last:ago(3)},{id:uid(),t:'Change bedsheets',every:14,last:ago(9)},
    {id:uid(),t:'Vacuum and mop',every:7,last:ago(7)},{id:uid(),t:'Clean bathroom',every:7,last:ago(2)},
    {id:uid(),t:'Clear out fridge',every:30,last:ago(12)},{id:uid(),t:'Washing machine clean cycle',every:30,last:ago(33)},
    {id:uid(),t:'Descale kettle',every:60,last:ago(20)},{id:uid(),t:'Water the plants',every:3,last:ago(1)}],
  recipes:[
    {id:uid(),t:'Garlic butter pasta',ing:['pasta','garlic','butter','parmesan','parsley']},
    {id:uid(),t:'Egg fried rice',ing:['rice','eggs','frozen peas','soy sauce','spring onions','garlic']},
    {id:uid(),t:'Tomato soup and grilled cheese',ing:['tomatoes','onion','garlic','bread','cheese','butter']},
    {id:uid(),t:'Veggie omelette',ing:['eggs','onion','bell pepper','cheese','butter']}],
  eatout:['Pizza','Sushi','Thai','Burgers','Our usual café','Tacos'],
  settings:{a:'Me',b:'Partner',token:'',chat:'',chatA:'',chatB:'',auto:true,digest:true,scNotes:'Nest Groceries',scMsg:'Nest Message'},
  lastDigest:'',lastSent:''
});
const DS=DEFAULTS().settings,LISTS=['groceries','inv','routines','recipes','eatout'];
let S=DEFAULTS();
try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw){S={...S,...raw,settings:{...S.settings,...raw.settings}}}}catch(e){}
/* L = things that stay on this device only */
let L={fb:'',key:'',email:'',rt:'',who:'a'};
try{Object.assign(L,JSON.parse(localStorage.getItem(LKEY))||{})}catch(e){}
const saveL=()=>{try{localStorage.setItem(LKEY,JSON.stringify(L))}catch(e){}};
if(GATED){L.fb=CONFIG.databaseURL;L.key=CONFIG.apiKey}
const locked=()=>GATED&&!L.rt;
function fix(){
  for(const k of LISTS){const v=S[k];S[k]=Array.isArray(v)?v.filter(x=>x!=null):v&&typeof v==='object'?Object.values(v):[]}
  S.recipes.forEach(r=>{r.ing=Array.isArray(r.ing)?r.ing:r.ing?Object.values(r.ing):[]});
  S.inv.forEach(x=>{x.qty=x.qty||'';x.exp=x.exp||'';x.loc=x.loc||'pantry'});
  S.settings={...DS,...S.settings};S.lastDigest=S.lastDigest||'';S.lastSent=S.lastSent||'';
}
fix();
const local=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{local();Sync.push()};
const me=()=>S.settings[L.who]||'Me';
let tab='home';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3000)}

/* ---------- private sync: Firebase sign-in + Realtime Database over REST ---------- */
const SYNCED=[...LISTS,'settings','lastDigest','lastSent'];
async function idp(path,body){
  const r=await fetch('https://identitytoolkit.googleapis.com/'+path+'?key='+encodeURIComponent(L.key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();if(j.error)throw new Error(j.error.message);return j;
}
const Sync={es:null,tok:'',timer:null,snap:{},on:false,msg:'',pending:null,
  base:()=>L.fb.replace(/\/+$/,'')+'/nest',
  ready:()=>/^https:\/\//.test(L.fb)&&!!L.key&&!!L.rt,
  state(on,msg){this.on=on;this.msg=on?'Signed in and syncing.':(msg||'');renderNav();const e=$('#syncmsg');if(e)e.textContent=this.msg},
  async signIn(pw){
    const j=await idp('v1/accounts:signInWithPassword',{email:L.email,password:pw,returnSecureToken:true});
    if(j.mfaPendingCredential){const f=(j.mfaInfo||[])[0]||{};this.pending={cred:j.mfaPendingCredential,id:f.mfaEnrollmentId};throw Object.assign(new Error('second step needed'),{mfa:true})}
    this.tok=j.idToken;L.rt=j.refreshToken;saveL();
  },
  async second(code){
    const j=await idp('v2/accounts/mfaSignIn:finalize',{mfaPendingCredential:this.pending.cred,mfaEnrollmentId:this.pending.id,totpVerificationInfo:{verificationCode:code}});
    this.pending=null;this.tok=j.idToken;L.rt=j.refreshToken;saveL();
  },
  async refresh(){
    const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(L.key),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(L.rt)});

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const w=$('.wheelbox');if(!w)return;const r=w.getBoundingClientRect(),c=document.createElement('canvas');c.id='confetti';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const x=c.getContext('2d'),P=Array.from({length:120},()=>{const a=Math.random()*Math.PI*2,v=5+Math.random()*10;return{x:r.left+r.width/2,y:r.top+r.height/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,s:6+Math.random()*7,c:PAL[Math.floor(Math.random()*4)],r:Math.random()*6,vr:(Math.random()-.5)*.4}}),t0=performance.now();
  (function f(t){const k=(t-t0)/2000;if(k>=1){c.remove();return}x.clearRect(0,0,c.width,c.height);x.globalAlpha=1-k*k;
    for(const p of P){p.vy+=.35;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);x.restore()}
    requestAnimationFrame(f)})(t0);
}
function spin(){
  const items=spinItems(),n=items.length;if(spinning)return;if(n<2){toast('Add at least two options first');return}
  const i=Math.floor(Math.random()*n),seg=360/n,jit=(Math.random()-.5)*seg*.7,box=$('.wheelbox'),res=$('#result');
  rot=rot-(rot%360)+360*8+(360-(i+.5)*seg)+jit;spinning=true;spinResult='';$('#after').innerHTML='';
  box.classList.remove('win');box.classList.add('go');res.className='result rolling';
  const roll=setInterval(()=>{const e=$('#result');if(e)e.textContent=items[Math.floor(Math.random()*n)]},110);
  $('#wheel').style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>{clearInterval(roll);spinning=false;spinResult=items[i];if(tab!=='spin'||!$('#result')){if(stale)softRender();return}
    $('.wheelbox').classList.remove('go');$('.wheelbox').classList.add('win');
    const r=$('#result');r.textContent=items[i];r.className='result pop';confetti();
    let h='';if(spinMode==='decide')h=items[i]==='Cook'?`<button class="btn leaf" data-a="sMode" data-k="cook">Now spin what to cook</button>`:`<button class="btn" data-a="sMode" data-k="out">Now spin where to go</button>`;
    else h=`<button class="btn soft" data-a="sTell">Tell the group</button>`+(spinMode==='cook'?` <button class="btn soft" data-a="sRecipe">See recipe</button>`:'');
    $('#after').innerHTML=h;if(stale)softRender()},5100);
}

function padSetup(){
  const c=$('#pad');if(!c)return;const d=devicePixelRatio||1;c.width=c.clientWidth*d;c.height=c.clientHeight*d;const x=c.getContext('2d');x.scale(d,d);
  const draw=()=>{x.fillStyle='#fff';x.fillRect(0,0,c.clientWidth,c.clientHeight);x.lineCap=x.lineJoin='round';
    for(const s of strokes){x.strokeStyle=x.fillStyle=s.c;x.lineWidth=s.w;x.beginPath();if(s.p.length===1){x.arc(s.p[0][0],s.p[0][1],s.w/2,0,7);x.fill();continue}
      x.moveTo(s.p[0][0],s.p[0][1]);for(let i=1;i<s.p.length;i++){const a=s.p[i-1],b=s.p[i];x.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}x.stroke()}};
  padSetup.draw=draw;draw();
  const pt=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{try{c.setPointerCapture(e.pointerId)}catch(_){}cur={c:penCol,w:penW,p:[pt(e)]};strokes.push(cur);draw()};
  c.onpointermove=e=>{if(cur){cur.p.push(pt(e));draw()}};
  c.onpointerup=c.onpointercancel=()=>{cur=null};
}

  cEdit:d=>{const r=byId(S.recipes,d.id);if(r)modal('Edit recipe',recipeForm(r),v=>{r.t=v.t;r.ing=lines(v.ing)},()=>{S.recipes=S.recipes.filter(i=>i!==r)})},
  cPaste:()=>modal('Paste recipes',`<p class="muted">Recipe name on the first line, ingredients underneath, a blank line between recipes. Or one per line: <code>Name: a, b, c</code></p><textarea name="txt" rows="10" style="margin-top:10px" placeholder="Dal tadka&#10;lentils&#10;onion&#10;tomatoes&#10;&#10;Pancakes: flour, eggs, milk"></textarea>`,v=>{const rs=parseRecipes(v.txt);S.recipes.push(...rs);toast(`Added ${plural(rs.length,'recipe')}`)}),
  cAddMissing:d=>{const r=byId(S.recipes,d.id);if(r){addGroceries(recipeStatus(r).missing.filter(p=>!p.listed).map(p=>p.n));render()}},
  cSurprise:()=>{if(!S.recipes.length){toast('Add a recipe first');return}const st=ranked(),ready=st.filter(x=>!x.s.missing.length),pool=ready.length?ready:st.slice().sort((a,b)=>a.s.missing.length-b.s.missing.length).slice(0,3),p=pool[Math.floor(Math.random()*pool.length)];
    picked=p.r.id;render();toast(`Tonight: ${p.r.t}${p.s.missing.length?`. You need ${p.s.missing.length} more.`:'. You have everything.'}`);const el=$('#rc-'+p.r.id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},
  spin,
  sMode:d=>{if(spinning)return;spinMode=d.k;spinResult='';render()},
  sTell:()=>tgSafe('sendMessage',{chat_id:S.settings.chat,text:(spinMode==='out'?'🎡 The wheel has spoken. We are eating out: ':'🎡 The wheel has spoken. We are cooking: ')+spinResult},'Told the group'),
  sRecipe:()=>{const r=S.recipes.find(r=>r.t===spinResult);tab='recipes';picked=r?r.id:'';render();const el=r&&$('#rc-'+r.id);if(el)el.scrollIntoView({block:'center'})},
  eDel:d=>{S.eatout.splice(+d.i,1);save();render()},
  nDest:d=>{dest=d.k;const cap=$('#cap').value;render();$('#cap').value=cap},
  nCol:d=>{penCol=d.c;document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===penCol))},
  nW:(d,b)=>{penW=+d.w;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))},
  nUndo:()=>{strokes.pop();padSetup.draw()},
  nWipe:()=>{strokes=[];padSetup.draw()},
  nSendDoodle:async()=>{if(!strokes.length){toast('Draw something first');return}const b=await padBlob();if(await tgSafe('sendPhoto',{chat_id:destChat(),photo:[b,'doodle.png'],caption:($('#cap').value||'💌')+' · from '+me()},`Doodle sent to ${destName()}`)){strokes=[];render()}},
  nShareDoodle:async()=>{if(!strokes.length){toast('Draw something first');return}const b=await padBlob();share({files:[new File([b],'doodle.png',{type:'image/png'})],text:$('#cap').value||''})},
  vRec:async()=>{
    if(rec){rec.stop();return}
    if(!navigator.mediaDevices||!window.MediaRecorder){toast('Recording needs the app to be opened over https');return}
    try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}),chunks=[];rec=new MediaRecorder(stream);
      rec.ondataavailable=e=>chunks.push(e.data);
      rec.onstop=()=>{const type=rec.mimeType||chunks[0]?.type||'audio/mp4',blob=new Blob(chunks,{type});stream.getTracks().forEach(t=>t.stop());rec=null;voice={blob,type,url:URL.createObjectURL(blob)};voiceUI()};
      rec.start();voiceUI()}catch(e){rec=null;toast('Microphone permission is needed')}},
  vClear:()=>{voice=null;voiceUI()},
  vSend:async()=>{const ogg=/ogg/.test(voice.type),ext=ogg?'ogg':/webm/.test(voice.type)?'webm':'m4a',m=ext==='webm'?'sendDocument':'sendVoice',k=ext==='webm'?'document':'voice';
    if(await tgSafe(m,{chat_id:destChat(),[k]:[voice.blob,'voice-note.'+ext],caption:'From '+me()},`Voice note sent to ${destName()}`)){voice=null;voiceUI()}},
  vShare:()=>{const ext=/ogg/.test(voice.type)?'ogg':/webm/.test(voice.type)?'webm':'m4a';share({files:[new File([voice.blob],'voice-note.'+ext,{type:voice.type})]})},
  nRemindSc:(d,b)=>{const t=b.form.t.value.trim();if(!t){toast('Write the reminder first');return}runShortcut(S.settings.scMsg,'🔔 '+t)},
  nRemindShare:(d,b)=>{const t=b.form.t.value.trim();if(!t){toast('Write the reminder first');return}share({text:'🔔 '+t})},
  who:d=>{L.who=d.k;saveL();render()},
  tTest:async()=>{if(await tgSafe('sendMessage',{chat_id:S.settings.chat,text:'🏡 Nest & Nibbles is connected!'},'Telegram is connected'))render()},
  tFind:async()=>{const ti=$('#tgtoken');if(ti&&ti.value.trim()){S.settings.token=cleanToken(ti.value)||ti.value.trim();ti.value=S.settings.token;save()}
    if(!S.settings.token){toast('Paste the bot token first');return}
    const out=$('#chats');if(out)out.innerHTML='<p class="muted">Looking for chats…</p>';
    try{let ups;try{ups=await tg('getUpdates',{})}catch(e){if(/webhook/i.test(e.message)){await tg('deleteWebhook',{});ups=await tg('getUpdates',{})}else throw e}
      const seen={};for(const u of ups){const c=(u.message||u.my_chat_member||u.channel_post||{}).chat;if(c)seen[c.id]=c}
      const cs=Object.values(seen);$('#chats').innerHTML=cs.length?cs.map(c=>`<div class="item"><div class="t">${esc(c.title||[c.first_name,c.last_name].filter(Boolean).join(' '))}<small>${esc(c.type)} · ${esc(c.id)}</small></div>${c.type==='private'?`<button class="btn sm soft" data-a="tUse" data-k="chatA" data-v="${esc(c.id)}">${esc(S.settings.a)}</button><button class="btn sm soft" data-a="tUse" data-k="chatB" data-v="${esc(c.id)}">${esc(S.settings.b)}</button>`:`<button class="btn sm" data-a="tUse" data-k="chat" data-v="${esc(c.id)}">Use as group</button>`}</div>`).join(''):'<p class="muted">The token works, but the bot has not seen any chat yet. Remove the bot from the group, add it again, send a message in the group, then tap Find our chats again.</p>'}
    catch(e){const m=/does not look like/.test(e.message)?'T'+e.message.slice(1)+'.':/Unauthorized|Not Found/i.test(e.message)?'Telegram does not recognise that token. Copy it again from @BotFather.':/Failed to fetch|Load failed|NetworkError/i.test(e.message)?'Could not reach Telegram from this device. Check the connection or any content blocker.':'Telegram said: '+e.message;const o=$('#chats');if(o)o.innerHTML='<p class="muted">'+esc(m)+'</p>';toast(m)}},
  tUse:(d,b)=>{S.settings[d.k]=d.v;save();b.textContent='Selected';toast('Saved')},
  sSign:async()=>{
    const say=m=>{const e=$('#syncmsg');if(e)e.textContent=m};
    try{
      if(loginStep==='code'){const c=$('#otp').value.replace(/\D/g,'');if(c.length<6){toast('Enter the 6-digit code');return}say('Checking…');await Sync.second(c)}
      else{const pw=$('#spw').value,em=$('#lem');if(em){L.email=em.value.trim();saveL()}
        if(!L.email||!pw){toast('Enter your email and password');return}say('Signing in…');await Sync.signIn(pw)}
      loginStep='pw';Sync.msg='';render();Sync.start(true);
    }catch(e){
      if(e.mfa){loginStep='code';Sync.msg='';render();const o=$('#otp');if(o)o.focus();return}
      Sync.state(false,loginStep==='code'?'That code was not accepted. Wait for the next one and try again.':'Sign-in failed. Check the email and password.')}},
  lBack:()=>{loginStep='pw';Sync.msg='';render()},
  mfaStart:async()=>{try{await Sync.refresh();mfa.session=(await idp('v2/accounts/mfaEnrollment:start',{idToken:Sync.tok,totpEnrollmentInfo:{}})).totpSessionInfo;mfaUI()}catch(e){mfaUI(mfaErr(e))}},
  mfaFinish:async()=>{const c=$('#mfacode').value.replace(/\D/g,'');if(c.length<6){toast('Enter the 6-digit code');return}
    try{const j=await idp('v2/accounts/mfaEnrollment:finalize',{idToken:Sync.tok,displayName:'Authenticator app',totpVerificationInfo:{sessionInfo:mfa.session.sessionInfo,verificationCode:c}});
      if(j.idToken){Sync.tok=j.idToken;L.rt=j.refreshToken;saveL()}mfa.session=null;mfa.on=true;mfaUI('Two-step sign-in is now on.');Sync.start(!!j.idToken)}catch(e){mfaUI(mfaErr(e))}},
  mfaCancel:()=>{mfa.session=null;mfaUI()},
  mfaVerify:async()=>{try{await idp('v1/accounts:sendOobCode',{requestType:'VERIFY_EMAIL',idToken:Sync.tok});mfaUI('Verification email sent to '+L.email+'. Open the link in it, then come back here.')}catch(e){mfaUI(mfaErr(e))}},
  sOut:()=>signOut(),
  bExport:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='nest-and-nibbles-backup-'+today()+'.json';a.click()},
  bImport:()=>$('#bfile').click(),
  bReset:(d,b)=>{if(Date.now()-resetArmed>4000){resetArmed=Date.now();b.textContent='Tap again to erase everything';return}
    try{localStorage.removeItem(KEY)}catch(e){}S=DEFAULTS();fix();save();resetArmed=0;render();toast('App reset')}
};
const F={
  gAdd:f=>{const v=f.t.value;if(v.trim())addGroceries(splitItems(v),true);render();$('#gin').focus()},
  iAdd:f=>{const t=f.t.value.trim();if(!t)return;S.inv.push({id:uid(),t:t[0].toUpperCase()+t.slice(1),qty:f.qty.value.trim(),loc:f.loc.value,exp:''});save();render();$('[data-f=iAdd] input').focus()},
  eAdd:f=>{const t=f.t.value.trim();if(!t)return;S.eatout.push(t);save();render()},
  login:()=>A.sSign(),
  nRemind:async f=>{if(await tgSafe('sendMessage',{chat_id:destChat(),text:'🔔 '+f.t.value.trim()+'\nfrom '+me()},`Reminder sent to ${destName()}`))f.reset()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){if(b.type!=='submit')e.preventDefault();A[b.dataset.a](b.dataset,b)}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(f){e.preventDefault();F[f.dataset.f](f)}});
document.addEventListener('change',e=>{
  const k=e.target.dataset.s,l=e.target.dataset.l;
  if(k){S.settings[k]=e.target.type==='checkbox'?e.target.checked:e.target.value.trim();save();if(/^(a|b|scNotes|scMsg)$/.test(k))stale=true}
  if(l){L[l]=e.target.value.trim();saveL()}
  if(e.target.id==='bfile'&&e.target.files[0]){e.target.files[0].text().then(t=>{const d=JSON.parse(t);if(!d.settings||!d.groceries)throw 0;S={...DEFAULTS(),...d};fix();save();render();toast('Backup restored')}).catch(()=>toast('That file is not a Nest & Nibbles backup'))}
});
addEventListener('resize',()=>{if(tab==='spin')drawWheel();if(tab==='notes')padSetup()});

/* morning digest of due routines (only fires while the app is open somewhere) */
function digest(){
  if(locked()||!S.settings.digest||!tgReady()||S.lastDigest===today()||new Date().getHours()<8)return;
  const due=S.routines.filter(r=>dueIn(r)<=0);S.lastDigest=today();save();if(!due.length)return;
  tg('sendMessage',{chat_id:S.settings.chat,text:'🏡 Today around the nest:\n'+due.map(r=>`• ${r.t}${dueIn(r)<0?` (${plural(-dueIn(r),'day')} overdue)`:''}`).join('\n')}).catch(()=>{});
}
setInterval(()=>{digest();if(busy())renderNav();else render()},30*60*1000);
local();render();
Sync.start().then(()=>setTimeout(digest,Sync.ready()?4000:0));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(tab==='spin')drawWheel()});

/* home-screen icon */
try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#8c6293';x.fillRect(0,0,180,180);x.fillStyle='#f5f5f5';x.beginPath();x.moveTo(90,38);x.lineTo(146,84);x.lineTo(146,142);x.lineTo(34,142);x.lineTo(34,84);x.closePath();x.fill();
  x.fillStyle='#d3782b';x.beginPath();x.arc(90,108,18,0,7);x.fill();$('#touchicon').href=c.toDataURL('image/png')}catch(e){}
})();
